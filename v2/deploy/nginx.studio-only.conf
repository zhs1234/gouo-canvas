# Prepared opt-in edge for New API 0aec08fee811ec6136828fda790551b49e410301.
# Ordinary account routes only. Administration, billing preference writes,
# notification setting replacement, dynamic plugins and all relay routes stay private.
# This file is mounted as an nginx envsubst template; existing edge is unchanged.
map $request_method $unsafe_method { default 1; GET 0; HEAD 0; OPTIONS 0; }
map $http_origin $same_origin { default 0; "${GOUO_PUBLIC_ORIGIN}" 1; }
map "$unsafe_method:$same_origin" $reject_origin { default 0; "1:0" 1; }
map $http_upgrade $reject_upgrade { default 1; "" 0; }
upstream native_self { server new-api:3000; }
upstream studio_self { server studio-api:3001; }
map $request_method $self_upstream { default native_self; PUT studio_self; }
# Fail closed on alternate path spellings; query encoding remains allowed.
map $request_uri $noncanonical_path {
  default 0;
  ~^[^?]*% 1;
  ~^[^?]*// 1;
  ~^[^?]*/\.\.?(/|\?|$) 1;
  ~^[^?]*\\\\ 1;
}
map "$request_method:$uri" $native_account_route {
  default 0;
  ~^GET:/api/(status|notice|user-agreement|privacy-policy|about|home_page_content|pricing|verification|reset_password)$ 1;
  ~^GET:/api/user/(login/encryption-key|groups|self|self/groups|models|sessions|token|token/status|passkey|2fa/status|topup/info|topup/self|oauth/bindings)$ 1;
  ~^POST:/api/user/(register|reset|login|login/2fa|login/verify|login/passkey/(begin|finish)|passkey/login/(begin|finish)|auth/(refresh|logout)|sessions/revoke-others|token|passkey/(register|verify)/(begin|finish)|2fa/(setup|enable|disable|backup_codes)|topup|pay|amount|stripe/(pay|amount)|creem/pay|waffo/(pay|amount)|waffo-pancake/(pay|amount))$ 1;
  # Only this exact PUT goes through Studio's profile/password whitelist.
  # Language/sidebar setting snapshots remain blocked by that adapter.
  ~^PUT:/api/user/self$ 1;
  ~^DELETE:/api/user/(self|token|passkey|sessions/[A-Za-z0-9_-]+|oauth/bindings/[0-9]+)$ 1;
  ~^GET:/api/verify/methods$ 1;
  ~^POST:/api/verify$ 1;
  ~^POST:/api/oauth/(state|email/bind(/(start|resend))?|wechat/bind|telegram/bind/start)$ 1;
  ~^GET:/api/oauth/(github|discord|oidc|linuxdo|wechat|telegram/login|telegram/bind/[A-Za-z0-9_-]+)$ 1;
  ~^GET:/api/token/(|search|auto-groups|[0-9]+)$ 1;
  # Token writes and complete keys stay private; Studio controls renewal.
  ~^GET:/api/(subscription/(plans|self)|log/self(/(stat|search))?|audit/self|data/(self|flow/self))$ 1;
  # Preference switching and subscription purchase are gated by Studio's paid transition.
}
map "$request_method:$uri" $native_ui_route {
  default 0;
  ~^(GET|HEAD):/(sign-in|sign-up|register|forgot-password|reset|user/reset|otp|oauth|profile|security|keys|wallet|usage-logs|pricing|about|user-agreement|privacy-policy)$ 1;
  ~^(GET|HEAD):/oauth/(github|discord|oidc|linuxdo|wechat|telegram)$ 1;
  ~^(GET|HEAD):/(assets|static)/[A-Za-z0-9_./-]+\.(js|css|woff2?|ttf|png|jpe?g|svg|webp|ico|json)$ 1;
  ~^(GET|HEAD):/(favicon\.ico|logo\.(png|svg)|manifest\.json|robots\.txt)$ 1;
}
server {
  absolute_redirect off;
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 20m;
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  if ($noncanonical_path) { return 404; }
  if ($reject_upgrade) { return 404; }
  if ($reject_origin) { return 403; }
  location = / { return 302 /studio/; }
  location = /healthz { default_type application/json; return 200 '{"success":true,"service":"gouo-edge-studio-only"}'; }
  location = /studio { return 301 /studio/; }
  location /studio/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /studio/index.html;
    add_header Cache-Control no-cache;
  }
  location ^~ /api/studio/ {
    proxy_pass http://studio-api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  location /api/ {
    if ($native_account_route = 0) { return 404; }
    proxy_pass http://new-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 180s;
  }
  location = /api/user/self {
    if ($native_account_route = 0) { return 404; }
    proxy_pass http://$self_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location / {
    if ($native_ui_route = 0) { return 404; }
    # Native NoRoute checks plugins before static assets. Never forward any
    # caller credentials or query to these HTML/static requests: a plugin
    # overlapping a UI path cannot pass its mandatory native TokenAuth.
    rewrite ^(.*)$ $1? break;
    proxy_pass_request_headers off;
    proxy_set_header Accept-Encoding "";
    sub_filter '</head>' '<script src="/studio/native-navigation.js"></script></head>';
    sub_filter_once on;
    proxy_pass http://new-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}

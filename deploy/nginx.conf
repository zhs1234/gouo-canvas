# 外层 TLS 代理已给出协议时透传，否则后端同源判断会把 https 页面误判为 http。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    # 禁止其他站点嵌入（跨站 Cookie 模式下可被点击劫持触发付费操作）。
    # location 里另写 add_header 时不会继承这里的头，所以下面的 location 重复列出。
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    # 入口页每次校验，发版后不会继续引用已删除的旧资源
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 带哈希的构建产物可长期缓存；不存在时返回 404，不能回落成 index.html，
    # 否则旧页面请求的旧脚本会拿到 HTML，被 Service Worker 当作脚本缓存后白屏
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /v1/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        # 需大于后端 15 分钟出图超时，否则长任务被代理截断后进入待核对
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
